<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | {{ SITE_CONFIG.brand_name }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #FDFBF7; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card { background: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid #F59E0B; width: 100%; max-width: 400px; }
        .login-title { font-size: 1.5rem; font-weight: 700; color: #B45309; text-align: center; margin-bottom: 0.5rem; }
        .login-sub { text-align: center; color: #5C4B3D; font-size: 0.9rem; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.4rem; color: #291E14; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid #D1C5B8; box-sizing: border-box; }
        .btn-login { width: 100%; background: #B45309; color: #fff; border: none; padding: 0.9rem; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; }
        .btn-login:hover { background: #D97706; }
        .alert { padding: 0.8rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; background: #FEE2E2; color: #991B1B; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-title">Astro Ashish Ji</div>
        <div class="login-sub">Admin Portal Login</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('admin.login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label>Admin Email Address</label>
                <input type="email" name="email" required placeholder="admin@astroashish.guru">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-login">Log In to Dashboard</button>
        </form>
    </div>
</body>
</html>
